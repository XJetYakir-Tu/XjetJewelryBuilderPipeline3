# XJet Atelier Pipeline 3 — install to /etc/nginx/snippets/jewelryb2c3.conf and `include` it from
# the port-80 default_server block (sites-enabled/dov-hello) and the 443 block
# (conf.d/packtical-ssl.conf), like every other app on tron. Locations only; no `server`.
#
#   http://tron/JewelryB2C3/    Pipeline 3 (the app redirects /JewelryB2C3 -> /JewelryB2C3/)
#
# The app is configured with P3_BASE_PATH=/JewelryB2C3 and serves EVERYTHING (pages, /api,
# /static, /assets, /dev) under that prefix, so nginx passes the full path through unchanged:
# no trailing URI on proxy_pass and no rewrites.

location ^~ /JewelryB2C3 {
    proxy_pass http://127.0.0.1:8340;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    # Reference images are capped at 10 MB by the app; leave headroom for multipart overhead.
    client_max_body_size 20m;
}
