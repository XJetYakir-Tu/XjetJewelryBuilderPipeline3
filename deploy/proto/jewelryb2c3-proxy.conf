# XJet Atelier Pipeline 3 on proto — forwards http://proto/JewelryB2C3/ to tron.
# Installed to /etc/nginx/snippets/jewelryb2c3-proxy.conf and `include`d once from the proto
# server block in /etc/nginx/sites-available/jewelry-b2c (see deploy/proto/setup-proto.sh).
# Owned by the Pipeline 3 repo; Pipeline 2's routes are not touched.
#
# The full path (prefix included) is passed through unchanged: tron's nginx and the P3 app
# both expect /JewelryB2C3/... . P3 issues relative redirects, so the browser stays on proto.

location ^~ /JewelryB2C3 {
    proxy_pass http://172.16.10.32;          # tron (IP: no resolver dependency at nginx start)
    proxy_set_header Host              tron;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
